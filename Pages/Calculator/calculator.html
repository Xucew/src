<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Taschenrechner</title>
  <link rel="stylesheet" href="../../Styles/main.css">
  <link rel="stylesheet" href="../Header/header.css">
  <link rel="stylesheet" href="calculator.css">
</head>
<body>
  <div id="site-header"></div>
  <script type="module" src="../../Scripts/header.ts"></script>

  <main class="calculator-empty"></main>

  <div id="site-footer"></div>
  <script type="module" src="../../Scripts/footer.ts"></script>
</body>


<body>
  <div id="Taschenrechner">
    <h2>Taschenrechner</h2>
    <div class="Taschenrechen-1"
      <input type="text" id="display" disabled>
      <div class="buttons">
        <button class="button" data-value="7">7</button>
        <button class="button" data-value="8">8</button>
        <button class="button" data-value="9">9</button>
        <button class="button operator" data-value="/">/</button>
        <button class="button" data-value="4">4</button>
        <button class="button" data-value="5">5</button>
        <button class="button" data-value="6">6</button>
        <button class="button operator" data-value="*">*</button>
        <button class="button" data-value="1">1</button>
        <button class="button" data-value="2">2</button>
        <button class="button" data-value="3">3</button>
        <button class="button operator" data-value="-">-</button>
        <button class="button" data-value="0">0</button>
        <button class="button" data-value=".">.</button>
        <button class="button operator" data-value="+">+</button>
        <button class="equal-button operator" id="equals">=</button>
    
    
    
    
    
  </div>
  

</html>
